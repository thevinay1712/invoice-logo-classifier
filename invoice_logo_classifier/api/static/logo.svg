<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44" fill="none">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background rounded squircle with gradient -->
  <rect x="2" y="2" width="40" height="40" rx="12" fill="url(#logoBg)"/>
  <!-- Specular top highlight ring -->
  <rect x="2.5" y="2.5" width="39" height="39" rx="11.5" stroke="rgba(255,255,255,0.4)" stroke-width="1" fill="none"/>
  <!-- Document silhouette in obsidian glass -->
  <path d="M12 11h13l7 7v13a2 2 0 0 1-2 2H12a2 2 0 0 1-2-2V13a2 2 0 0 1 2-2z" fill="#0b101d" fill-opacity="0.92"/>
  <!-- Folded corner flap -->
  <path d="M25 11v5a2 2 0 0 0 2 2h5" fill="url(#foldGrad)" stroke="rgba(255,255,255,0.45)" stroke-width="0.8"/>
  <!-- AI Logo Reticle in vibrant cyan -->
  <circle cx="21" cy="24" r="5" stroke="#38bdf8" stroke-width="1.6" stroke-dasharray="2 1.5"/>
  <circle cx="21" cy="24" r="2.2" fill="#ffffff" filter="url(#coreGlow)"/>
  <!-- Precision optical brackets -->
  <path d="M15 19v-2h2 M25 17h2v2 M15 29v2h2 M25 31h2v-2" stroke="#a5b4fc" stroke-width="1.2" stroke-linecap="round"/>
</svg>
